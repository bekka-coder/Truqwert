<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Truelance</title>
<style>
:root{--bg:#f3f5f9;--card:#fff;--tx:#141a2b;--mut:#6b7590;--ac:#3b5bff;--up:#0f9d6a;--dn:#e03a4e;--bd:#dde2ee;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0e1a;--card:#131a2c;--tx:#e8ecf6;--mut:#8b95b0;--ac:#7b93ff;--up:#2ecc8f;--dn:#ff5c6c;--bd:#222b45;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a0e1a;--card:#131a2c;--tx:#e8ecf6;--mut:#8b95b0;--ac:#7b93ff;--up:#2ecc8f;--dn:#ff5c6c;--bd:#222b45;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:70px}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 6px}
header small{display:block;color:var(--mut);font-size:12px}header b{font-size:22px;font-variant-numeric:tabular-nums}
.dn{color:var(--dn)}.up{color:var(--up)}
#th{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:50%;width:38px;height:38px;font-size:18px}
#gb{margin:6px 16px;padding:10px 12px;background:var(--card);border:1px solid var(--bd);border-radius:14px}
#gb div{display:flex;justify-content:space-between;font-size:13px;margin-bottom:6px}
#gb i{display:block;height:6px;background:var(--bd);border-radius:3px;overflow:hidden}#gp{display:block;height:100%;width:0;background:var(--ac);transition:width .4s}
main{padding:6px 16px}section{display:none}section.on{display:block;animation:in .25s}
@keyframes in{from{opacity:0;transform:translateY(6px)}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:12px;margin-bottom:10px}
.chips{display:flex;gap:8px;margin-bottom:10px}
.chip{flex:1;text-align:left;background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:12px;padding:8px 10px}
.chip.s{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac)}.chip small{display:block;color:var(--mut)}
.cw{position:relative;overflow:hidden}canvas{width:100%;height:190px;display:block}
.row{display:flex;gap:6px;margin-top:8px}.row button{flex:1}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:9px 8px}
button:active{transform:scale(.96)}.buy{background:var(--up);color:#fff;border:0}.sell{background:var(--dn);color:#fff;border:0}.b{display:block;width:100%;margin-top:8px;background:var(--ac);color:#fff;border:0}
.q{position:absolute;width:38px;height:38px;border-radius:50%;background:var(--ac);color:#fff;border:0;font-weight:700;font-size:18px;animation:pop .3s,pulse 1s infinite alternate}
@keyframes pop{from{transform:scale(0)}}@keyframes pulse{to{box-shadow:0 0 0 8px transparent;opacity:.8}}
#ck{width:170px;height:170px;border-radius:50%;margin:14px auto;display:block;font-size:56px;background:var(--ac);border:0;box-shadow:0 10px 30px rgba(59,91,255,.35)}
.fl{position:fixed;pointer-events:none;color:var(--up);font-weight:700;animation:fl .9s forwards}@keyframes fl{to{transform:translateY(-60px);opacity:0}}
.it{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--bd)}.it:last-child{border:0}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;border-radius:0;background:none;color:var(--mut);padding:10px 2px;font-size:12px}nav button.on{color:var(--ac);font-weight:600}
#md{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);align-items:center;justify-content:center;z-index:50;padding:20px}
.box{background:var(--card);border-radius:18px;padding:18px;max-width:360px;width:100%;animation:pop .25s}.box h3{margin:0 0 6px}
#ts{position:fixed;top:calc(env(safe-area-inset-top,0px) + 8px);left:0;right:0;display:flex;flex-direction:column;align-items:center;gap:6px;z-index:60;pointer-events:none}
.toast{background:var(--tx);color:var(--bg);padding:8px 14px;border-radius:20px;font-size:14px;animation:pop .2s}
.ad{position:fixed;z-index:40;width:200px;padding:10px;background:#ffd84d;color:#222;border-radius:10px;font-weight:600;animation:pop .2s}
.ad span{position:absolute;top:2px;right:4px;font-size:11px;opacity:.6;padding:2px}
input{font:inherit;width:100%;padding:9px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx)}
</style><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&display=swap"><style>
:root{--ac:#5b45ff;--card:rgba(255,255,255,.72)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ac:#8f82ff;--card:rgba(24,30,58,.62)}}
:root[data-theme="dark"]{--ac:#8f82ff;--card:rgba(24,30,58,.62)}
body{font-family:Manrope,system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:96px;background:radial-gradient(60% 40% at 8% -5%,color-mix(in srgb,var(--ac) 32%,transparent),transparent),radial-gradient(50% 35% at 100% 12%,rgba(25,211,197,.2),transparent),var(--bg);background-attachment:fixed}
#cap{font-size:30px;font-weight:800;letter-spacing:-.02em}
.card,#gb,.chip,.box{backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.card{border-radius:22px;box-shadow:0 10px 32px rgba(0,0,0,.14)}
#gb{border-radius:18px}#gb i{height:8px;border-radius:4px}#gp{background:linear-gradient(90deg,var(--ac),#19d3c5)}
.chip{border-radius:16px;font-weight:700}.chip.s{background:color-mix(in srgb,var(--ac) 16%,var(--card))}
button{font-weight:700}
.buy{background:linear-gradient(135deg,#19c98a,#0d9a69);box-shadow:0 6px 16px rgba(25,201,138,.3)}
.sell{background:linear-gradient(135deg,#ff5c7a,#d8324f);box-shadow:0 6px 16px rgba(255,92,122,.3)}
.b{background:linear-gradient(135deg,var(--ac),#19b5d3);border-radius:14px;padding:12px}
#ck{background:radial-gradient(circle at 30% 28%,#fff0b3,#ffc233 55%,#d98a00);font-size:68px;box-shadow:0 14px 40px rgba(255,194,51,.45),inset 0 -8px 18px rgba(150,90,0,.35);animation:fy 3s ease-in-out infinite}
@keyframes fy{50%{transform:translateY(-8px)}}#ck:active{animation:none;transform:scale(.93)}
.q{background:linear-gradient(135deg,var(--ac),#19d3c5);box-shadow:0 0 18px var(--ac)}
nav{left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));border:1px solid var(--bd);border-radius:26px;padding:6px;backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);box-shadow:0 12px 36px rgba(0,0,0,.25)}
nav button{border-radius:20px;padding:8px 2px}nav button.on{background:color-mix(in srgb,var(--ac) 20%,transparent)}
.box{border:1px solid var(--bd);border-radius:24px}
.ad{width:190px;padding:0;overflow:hidden;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:18px;backdrop-filter:blur(18px);box-shadow:0 14px 40px rgba(0,0,0,.35)}
.ad img{display:block;width:100%}.ad b{display:block;padding:8px 10px 0;font-size:14px}.ad small{display:block;padding:0 10px;color:var(--mut);font-weight:500}
.ad u{display:block;margin:8px 10px 10px;text-align:center;background:var(--ac);color:#fff;border-radius:10px;padding:7px;text-decoration:none;font-weight:700}
.ad span{z-index:1;top:4px;right:4px;width:38px;height:38px;padding:0;border-radius:50%;background:rgba(0,0,0,.6);color:#fff;text-align:center;line-height:38px;font-size:20px;opacity:1}
.chips{flex-wrap:wrap}.chip{flex:1 1 30%}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}.cell{aspect-ratio:1;font-size:15px;border-radius:14px;background:linear-gradient(135deg,var(--ac),#19b5d3);color:#fff;border:0;padding:0}.cell.w{background:var(--up)}.cell.l{background:var(--dn)}
#nt{position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:45;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.nt{pointer-events:auto;background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:10px 12px;backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(0,0,0,.3);animation:pop .25s}.nt p{margin:0 0 6px}
#bn{position:fixed;inset:0;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center;color:#fff;background:radial-gradient(circle at 50% 30%,#ff2fb3,#5b1bff 60%,#0b0720);animation:pop .3s}
#bn h2{margin:0;font-size:28px;line-height:1.1;text-shadow:0 0 20px #ffd84d}.bi{font-size:64px}#bn .b{max-width:300px;background:#ffd84d;color:#222;font-size:17px}#bn #bc{background:rgba(255,255,255,.25);color:#fff;border:0;padding:14px 26px;font-size:17px;border-radius:14px}
footer{text-align:center;color:var(--mut);font-size:12px;padding:10px 0 4px}nav button{font-size:11px}
#mb{background:var(--card);border:1px solid var(--bd);color:var(--tx);border-radius:50%;width:38px;height:38px;font-size:18px;padding:0}
#mn{display:none;position:fixed;inset:0;z-index:100;background:rgba(5,8,20,.72);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);align-items:center;justify-content:center;padding:20px}#mn .box{text-align:center}#ts{z-index:120}
</style></head><body>
<header><div><small>Капитал</small><b id="cap"></b></div><div><small>Деньги</small><b id="cash"></b></div><div style="display:flex;gap:8px"><button id="mb">☰</button><button id="th">◐</button></div></header>
<div id="gb"><div><span id="gt">Поставьте цель</span><span id="tm"></span></div><i><u id="gp"></u></i></div>
<main>
<section id="t-ex" class="on"><div class="chips" id="chips"></div>
<div class="card"><div class="cw" id="cw"><canvas id="cv"></canvas></div><div id="pos" style="color:var(--mut);margin-top:6px"></div>
<div class="row"><button class="buy" onclick="buy(.25)">Купить 25%</button><button class="buy" onclick="buy(.5)">50%</button><button class="buy" onclick="buy(1)">100%</button></div>
<div class="row"><button class="sell" onclick="sell(.25)">Продать 25%</button><button class="sell" onclick="sell(.5)">50%</button><button class="sell" onclick="sell(1)">100%</button></div></div>
<p style="color:var(--mut);font-size:13px">Комиссия 1% с каждой сделки. Нажимайте «?» на графике, пока они не пропали.</p></section>
<section id="t-ck"><button id="ck" onclick="clk(event)">🪙</button><div class="card" id="ci" style="text-align:center"></div></section>
<section id="t-sh"><div class="card" id="lv"></div><div class="card" id="shop"></div></section>
<section id="t-dr"><div class="card" id="dr"></div></section>
<section id="t-bt"><div class="card" id="bets"></div></section>
<section id="t-bk"><div class="card" id="bank"></div></section>
</main><footer>By BekaBratan</footer>
<nav id="nav"><button data-t="ex" class="on">📈 Биржа</button><button data-t="ck">🪙 Клик</button><button data-t="sh">🛒 Магазин</button><button data-t="bt">⚽ Ставки</button><button data-t="bk">🏦 Банк</button><button data-t="dr">✨ Мечты</button></nav>
<div id="nt"></div><div id="mn"></div><div id="md"></div><div id="ts"></div>
<script>
const $=s=>document.querySelector(s),fmt=n=>n.toLocaleString('ru-RU',{minimumFractionDigits:2,maximumFractionDigits:2})+' ₸';
const S={lv:1,own:{},myad:0,bm:1,cash:100,loan:0,hold:{K:0,P:0,B:0,D:0,A:0},cp:.05,au:0,cl:0,shield:0,goal:null,t:300,sel:'K',sec:0,win:0};
const ST={K:{n:'KazpiBonk',p:100,v:.006,d:.0005,tr:0,h:[]},P:{n:'Popich',p:50,v:.03,d:0,tr:0,h:[]},B:{n:'Bobka',p:30,v:.015,d:.0003,tr:0,h:[],need:2},D:{n:'Durex',p:200,v:.012,d:.0006,tr:0,h:[],need:4},A:{n:'Ahmedik',p:15,v:.05,d:.0002,tr:0,h:[],need:8}};
for(const k in ST)for(let i=0;i<60;i++)ST[k].h.push(ST[k].p);
const cap=()=>S.cash+Object.keys(ST).reduce((a,k)=>a+S.hold[k]*ST[k].p,0)-S.loan;
const D=[['Лёгкая',1.2,.2,.05],['Средняя',1.5,.35,.2],['Сложная',2,.5,.5]];
function toast(t,c){const e=document.createElement('div');e.className='toast';e.textContent=t;$('#ts').append(e);setTimeout(()=>e.remove(),2600)}
function modal(h){$('#md').innerHTML='<div class="box">'+h+'</div>';$('#md').style.display='flex'}
function closeM(){$('#md').style.display='none'}
function pickGoal(){modal('<h3>Поставьте цель</h3><p style="color:var(--mut)">За 5 минут капитал должен вырасти. Не успеете — «государство» заберёт часть денег.</p>'+D.map((d,i)=>`<button class="b" onclick="setGoal(${i})">${d[0]}: ×${d[1]}, штраф ${d[2]*100}%</button>`).join(''))}
function setGoal(i){const b=Math.max(cap(),10);S.goal={i,b,target:b*D[i][1]};S.t=300;closeM();render()}
function buy(f){if(S.cash<=0)return toast('Нет свободных денег');const k=S.sel,a=S.cash*f;S.hold[k]+=a*.99/ST[k].p;S.cash-=a;render()}
function sell(f){const k=S.sel,u=S.hold[k]*f;if(u<=0)return toast('Нечего продавать');S.cash+=u*ST[k].p*.99;S.hold[k]-=u;render()}
function pick(k){if((ST[k].need||0)>S.lv)return toast('Откроется на уровне '+ST[k].need);S.sel=k;render()}
const mul=()=>Math.pow(2,S.lv-1);function clk(e){const v=S.cp*mul();S.cash+=v;const f=document.createElement('div');f.className='fl';f.textContent='+'+v.toFixed(2);f.style.left=e.clientX+'px';f.style.top=e.clientY+'px';document.body.append(f);setTimeout(()=>f.remove(),900);if(navigator.vibrate)navigator.vibrate(8);render()}
const I=[['Сила клика +0,05 ₸',()=>5*Math.pow(1.5,S.cl),()=>{S.cp+=.05;S.cl++}],['Автокликер +0,1 ₸/с',()=>40*Math.pow(1.8,S.au),()=>S.au++],['Щит от государства (1 раз)',()=>150,()=>S.shield++],['Своя реклама на 3 минуты',()=>60,()=>S.myad=180]];
function shopBuy(i){const c=I[i][1]();if(S.cash<c)return toast('Не хватает денег');S.cash-=c;I[i][2]();render()}
function loan(a){if(S.cash<0)return toast('Сначала выберитесь из минуса');if(S.loan+a>300)return toast('Лимит кредита 300 ₸');S.cash+=a;S.loan+=a;render()}
function repay(a){a=Math.min(a,S.loan);if(S.cash<a||a<=0)return toast('Нечем платить');S.cash-=a;S.loan-=a;render()}
const SP={'Футбол':['Тулпар','Барс'],'Теннис':['Аружан','Мадина'],'Бокс':['Алмас','Ерлан'],'Шахматы':['Айдос','Тимур']};
const B={sp:'Футбол',p:.5,run:null};
function renderBets(){const n=SP[B.sp],kA=.95/B.p,kB=.95/(1-B.p);$('#bets').innerHTML='<div class="chips">'+Object.keys(SP).map(s=>`<button class="chip ${s==B.sp?'s':''}" onclick="B.sp='${s}';B.p=.3+Math.random()*.4;renderBets()">${s}</button>`).join('')+`</div><p><b>${n[0]}</b> ×${kA.toFixed(2)} — <b>${n[1]}</b> ×${kB.toFixed(2)}</p><input id="ba" type="number" min="1" value="10"><div class="row"><button class="buy" onclick="bet(0)">На ${n[0]}</button><button class="buy" onclick="bet(1)">На ${n[1]}</button></div><p id="bst" style="color:var(--mut)"></p><div class="row" style="justify-content:space-between"><b>Клетки удачи</b><span id="gl" style="color:var(--mut)"></span></div><div id="gr" class="grid"></div>`;renderGrid()}
function bet(s){const a=+$('#ba').value;if(B.run)return toast('Матч уже идёт');if(S.cash<0)return toast('В минусе ставки закрыты');if(!(a>0)||a>S.cash)return toast('Проверьте сумму');S.cash-=a;B.run={s,a,l:25};render()}
function endBet(){const r=B.run,p=r.s?1-B.p:B.p,w=Math.random()<p;if(w){S.cash+=r.a*.95/p;toast('Выигрыш +'+fmt(r.a*.95/p-r.a))}else toast('Проигрыш −'+fmt(r.a));B.run=null;B.p=.3+Math.random()*.4;renderBets();render()}
const AD=[['#ff6a3d','#ffb347','Ты выиграл iPhone!','Забери приз за 1 клик','<rect x="62" y="10" width="36" height="60" rx="7" fill="#111"/><rect x="66" y="16" width="28" height="44" rx="3" fill="#7bd3ff"/><circle cx="80" cy="65" r="2" fill="#666"/>'],['#7b2ff7','#f107a3','Крипто ×100 за день','Без риска!*','<circle cx="80" cy="40" r="24" fill="#ffd84d"/><text x="80" y="49" font-size="26" font-weight="700" text-anchor="middle" fill="#a66b00">₿</text><path d="M24 62 L56 38 L72 46" stroke="#fff" stroke-width="3" fill="none"/>'],['#00c6a7','#1e90ff','Кредит 0%*','*мелким шрифтом','<rect x="42" y="18" width="76" height="46" rx="7" fill="#fff"/><rect x="42" y="28" width="76" height="9" fill="#1e3a8a"/><rect x="48" y="46" width="26" height="6" rx="3" fill="#93a4c8"/>'],['#ff3d71','#ff9a3d','Бонус 500% на депозит','Только сегодня','<rect x="52" y="30" width="56" height="38" rx="4" fill="#fff"/><rect x="76" y="30" width="8" height="38" fill="#ff3d71"/><rect x="48" y="22" width="64" height="12" rx="4" fill="#ffd84d"/>']];
function adImg(a){const s=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 80"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${a[0]}"/><stop offset="1" stop-color="${a[1]}"/></linearGradient></defs><rect width="160" height="80" fill="url(#g)"/><circle cx="20" cy="15" r="30" fill="#fff" opacity=".14"/><circle cx="150" cy="72" r="26" fill="#fff" opacity=".1"/>${a[4]}</svg>`;return 'data:image/svg+xml,'+encodeURIComponent(s)}
function ad(){const a=AD[Math.floor(Math.random()*AD.length)],e=document.createElement('div');e.className='ad';e.style.left=Math.random()*(innerWidth-220)+'px';e.style.top=60+Math.random()*(innerHeight-200)+'px';e.innerHTML=`<span>✕</span><img src="${adImg(a)}" alt=""><b>${a[2]}</b><small>${a[3]}</small><u>Открыть</u>`;e.onclick=ev=>{if(ev.target.tagName!='SPAN'){const l=Math.max(20,S.cash*.1);S.cash-=l;toast('Реклама обманула: −'+fmt(l))}e.remove();render()};document.body.append(e);setTimeout(()=>e.remove(),9000)}
const O=[{t:'Инсайд за 10 ₸: «Popich скоро вырастет».',a:'Купить',b:'Отказаться',ya(){if(S.cash<10)return toast('Не хватает денег');S.cash-=10;if(Math.random()<.6){ST.P.p*=1.12;toast('Инсайд сработал','up')}else{ST.P.p*=.8;S.cash-=Math.max(10,S.cash*.05);toast('Инсайд был фейком: Popich упал, деньги потеряны')}}},
{t:'Спонсор даёт 30 ₸, но придётся закрыть 3 рекламы.',a:'Согласиться',b:'Отказаться',ya(){S.cash+=30;ad();ad();ad()}},
{t:'Налоговая: заплатить 5% наличных или рискнуть?',a:'Заплатить',b:'Рискнуть',ya(){S.cash-=Math.max(S.cash,0)*.05},yb(){if(Math.random()<.5){S.cash-=Math.max(S.cash,0)*.15;toast('Проверка нашла нарушения: −15%')}else toast('Повезло, проверка прошла мимо')}}];
function offer(){if($('#md').style.display=='flex')return;const i=Math.floor(Math.random()*O.length),o=O[i];modal(`<h3>Предложение</h3><p>${o.t}</p><button class="b" onclick="act(${i},'a')">${o.a}</button><button class="b" style="background:var(--bd);color:var(--tx)" onclick="act(${i},'b')">${o.b}</button>`);setTimeout(()=>{if($('#md').innerHTML.includes(o.t))closeM()},8000)}
function act(i,w){const f=O[i]['y'+w];if(f)f();closeM();render()}
function spawnQ(){if($('.q'))return;const b=document.createElement('button');b.className='q';b.textContent='?';b.style.left=10+Math.random()*75+'%';b.style.top=10+Math.random()*65+'%';b.onclick=()=>{b.remove();const k=S.sel,base=S.hold[k]*ST[k].p,m=base>1?base:20,r=Math.random();if(r<.4){const g=m*(.05+Math.random()*.2);S.cash+=g;toast('Удача: +'+fmt(g))}else if(r<.8){const l=m*(.1+Math.random()*.35);S.cash-=l;toast('Неудача: −'+fmt(l))}else toast('Ничего не произошло');render()};$('#cw').append(b);setTimeout(()=>b.remove(),5000)}
function draw(){const c=$('#cv'),r=devicePixelRatio||1,w=c.clientWidth,h=c.clientHeight;c.width=w*r;c.height=h*r;const x=c.getContext('2d');x.scale(r,r);const hs=ST[S.sel].h,mn=Math.min(...hs),mx=Math.max(...hs),rg=(mx-mn)||1,col=getComputedStyle(document.documentElement).getPropertyValue(hs[59]>=hs[0]?'--up':'--dn');x.strokeStyle=col;x.lineWidth=3;x.lineJoin='round';x.shadowColor=col;x.shadowBlur=14;x.beginPath();hs.forEach((v,i)=>{const px=i/59*w,py=h-10-(v-mn)/rg*(h-20);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke();x.lineTo(w,h);x.lineTo(0,h);x.closePath();x.shadowBlur=0;const gr=x.createLinearGradient(0,0,0,h);gr.addColorStop(0,col);gr.addColorStop(1,'transparent');x.globalAlpha=.28;x.fillStyle=gr;x.fill()}
function render(){$('#cap').textContent=fmt(cap());$('#cash').textContent=fmt(S.cash);$('#cash').className=S.cash<0?'dn':'';
if(S.goal){$('#gt').textContent='Цель: '+fmt(S.goal.target);$('#tm').textContent=Math.floor(S.t/60)+':'+String(S.t%60).padStart(2,'0');$('#gp').style.width=Math.max(0,Math.min(100,cap()/S.goal.target*100))+'%'}
$('#chips').innerHTML=Object.keys(ST).map(k=>{const s=ST[k],ch=(s.p/s.h[0]-1)*100;return`<button class="chip ${k==S.sel?'s':''}" onclick="pick('${k}')">${s.n}${s.need>S.lv?' 🔒'+s.need:''}<small>${fmt(s.p)} <span class="${ch>=0?'up':'dn'}">${ch>=0?'+':''}${ch.toFixed(1)}%</span></small></button>`}).join('');
$('#pos').textContent='В портфеле: '+S.hold[S.sel].toFixed(3)+' шт ≈ '+fmt(S.hold[S.sel]*ST[S.sel].p);
$('#ci').innerHTML=`За клик: <b>${(S.cp*mul()).toFixed(2)} ₸</b><br>Автокликер: <b>${(S.au*.1*mul()).toFixed(1)} ₸/с</b>`;
$('#shop').innerHTML=I.map((it,i)=>`<div class="it"><span>${it[0]}${i==2?' · есть: '+S.shield:''}${i==3&&S.myad>0?' · '+S.myad+' с':''}</span><button onclick="shopBuy(${i})">${fmt(it[1]())}</button></div>`).join('');
$('#bank').innerHTML=`<p>Долг: <b class="${S.loan?'dn':''}">${fmt(S.loan)}</b><br><span style="color:var(--mut)">Каждую минуту списывается 3% от долга (${fmt(S.loan*.03)}). Через ${60-S.sec%60} с. Не хватит денег — уйдёте в минус.</span></p><div class="row"><button class="buy" onclick="loan(100)">Взять 100 ₸</button><button onclick="repay(100)">Вернуть 100</button><button onclick="repay(9999)">Всё</button></div>`;
const bs=$('#bst');if(bs)bs.textContent=B.run?'Матч идёт… '+B.run.l+' с':'';draw()}
function tick(){if(paused)return;S.sec++;tickX();if(S.sec%10==0)save(1);for(const k in ST){const s=ST[k];s.tr=s.tr*.92+(Math.random()-.5)*s.v*.6;const r=s.d+s.tr+s.v*(Math.random()+Math.random()-1);s.p=Math.max(1,s.p*(1+r));s.h.push(s.p);s.h.shift()}
S.cash+=S.au*.1*mul();if(S.loan&&S.sec%60==0){S.cash-=S.loan*.03;toast('Проценты по кредиту: −'+fmt(S.loan*.03))}
if(B.run&&--B.run.l<=0)endBet();
if(S.goal){S.t--;if(cap()>=S.goal.target){const d=D[S.goal.i];S.cash+=S.goal.b*d[3];toast('Цель выполнена! Бонус '+fmt(S.goal.b*d[3]));S.goal=null;pickGoal()}else if(S.t<=0){const d=D[S.goal.i];S.goal=null;if(S.shield>0){S.shield--;toast('Щит спас от штрафа')}else{const p=Math.max(S.cash,0)*d[2];S.cash-=p;toast('Государство забрало '+fmt(p))}pickGoal()}
if(Math.random()<.1)spawnQ();if(S.sec%45==0)offer();if(S.sec%35==0)ad()}
render()}
$('#nav').onclick=e=>{const t=e.target.dataset.t;if(!t)return;document.querySelectorAll('section').forEach(s=>s.classList.remove('on'));$('#t-'+t).classList.add('on');document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b==e.target));render()};
$('#th').onclick=()=>{const d=document.documentElement,c=d.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'),n=c=='dark'?'light':'dark';d.dataset.theme=n;try{localStorage.setItem('tl-theme',n)}catch(e){}render()};
try{const t=localStorage.getItem('tl-theme');if(t)document.documentElement.dataset.theme=t}catch(e){}
const DR=[['🚗','Лада',1e5,'Такси-заказы: 1–5 тыс. ₸'],['🚙','Крузак',2e5,'Заказы: 10–20 тыс. ₸'],['🏠','Дом',5e5,'Аренда: 67 тыс. ₸ за ночь'],['🏢','Бизнес',999000,'Доход 100–300 тыс. ₸']];
const GU=[['Семья с детьми',.05],['Студенты',.45],['Командировочный',.1],['Компания друзей',.3],['Молодожёны',.08]],MT=['Ремонт кассы','Налоговый сбор','Охрана','Реклама бизнеса','Уборка'];
const G={l:120,c:Array(16).fill(null)};
function renderGrid(){$('#gr').innerHTML=G.c.map((v,i)=>`<button class="cell ${v==null?'':v>0?'w':'l'}" onclick="cellGo(${i})" ${v==null?'':'disabled'}>${v==null?'?':(v>0?'+':'−')+Math.abs(v).toFixed(0)}</button>`).join('')}
function cellGo(i){if(G.c[i]!=null)return;if(S.cash<0)return toast('В минусе клетки закрыты');const a=Math.max(S.cash,20)*(.05+Math.random()*.25),v=Math.random()<.45?a:-a;G.c[i]=v;S.cash+=v;toast((v>0?'Выигрыш +':'Проигрыш −')+fmt(Math.abs(v)));renderGrid();render()}
function dream(i){const d=DR[i];if(S.own[i])return;if(S.cash<d[2])return toast('Нужно '+fmt(d[2]));S.cash-=d[2];S.own[i]=1;toast('Мечта сбылась: '+d[1]+'!');render()}
function lvUp(){const c=1000*Math.pow(3,S.lv-1);if(S.cash<c)return toast('Нужно '+fmt(c));S.cash-=c;S.lv++;toast('Уровень '+S.lv);render()}
function note(t,btns,ttl,exp){const e=document.createElement('div');e.className='nt';e.innerHTML='<p>'+t+'</p><div class="row"></div>';btns.forEach(b=>{const x=document.createElement('button');x.textContent=b[0];x.className=b[2]||'';x.onclick=()=>{e.remove();b[1]();render()};e.querySelector('.row').append(x)});$('#nt').append(e);setTimeout(()=>{if(e.isConnected){e.remove();exp&&exp();render()}},ttl||12000)}
function taxi(a,b,n){const g=a+Math.round(Math.random()*(b-a)/100)*100;note('🚕 Заказ такси ('+n+'): '+fmt(g),[['Взять',()=>{S.cash+=g;toast('+'+fmt(g))},'buy'],['Пропустить',()=>{}]],10000)}
function rent(){const g=GU[Math.floor(Math.random()*GU.length)],n=1+Math.floor(Math.random()*7),p=67000*n*(n>=3?1.1:1);note('🏠 '+g[0]+' хотят снять дом на '+n+' ноч. за '+fmt(p),[['Сдать',()=>{S.cash+=p;if(Math.random()<g[1]){const d=(20+Math.round(Math.random()*20))*1000;S.cash-=d;toast('Погром! Ущерб −'+fmt(d))}else toast('Аренда +'+fmt(p))},'buy'],['Отказать',()=>{}]],12000)}
function maint(){const c=(20+Math.round(Math.random()*30))*1000,t=MT[Math.floor(Math.random()*MT.length)],bad=()=>{S.bm=Math.max(.3,S.bm*.8)};note('🏢 Бизнесу нужно: '+t+' — '+fmt(c),[['Оплатить',()=>{if(S.cash<c){bad();return toast('Не хватило денег, доход падает')}S.cash-=c;S.bm=Math.min(1,S.bm+.2)},'buy'],['Не платить',bad]],12000,()=>{bad();toast('Без обслуживания доход бизнеса падает')})}
function banner(){if($('#bn'))return;const e=document.createElement('div');e.id='bn';e.innerHTML='<div class="bi">🎰💥🤑</div><h2>MillionXBetBoomBoost</h2><p>Бонус ×1000 на первый депозит!</p><button class="b" id="bp">Играть и забрать бонус</button><button id="bc" disabled>Закрыть через 3</button>';document.body.append(e);$('#bp').onclick=()=>{const l=Math.max(30,S.cash*.15);S.cash-=l;toast('Вас обманули: −'+fmt(l));e.remove();render()};let n=3;const iv=setInterval(()=>{n--;const b=$('#bc');if(!b)return clearInterval(iv);if(n>0)b.textContent='Закрыть через '+n;else{b.disabled=false;b.textContent='✕ Закрыть';b.onclick=()=>e.remove();clearInterval(iv)}},1000);setTimeout(()=>{e.remove();clearInterval(iv)},10000)}
function tickX(){if(S.myad>0){S.myad--;if(Math.random()<.1){const g=5+Math.random()*35;S.cash+=g;toast('Кто-то повёлся на вашу рекламу: +'+fmt(g))}}
if(--G.l<=0){G.l=120;G.c=Array(16).fill(null);renderGrid()}
if(S.own[0]&&Math.random()<.03)taxi(1000,5000,'Лада');if(S.own[1]&&Math.random()<.02)taxi(10000,20000,'Крузак');if(S.own[2]&&Math.random()<.012)rent();
if(S.own[3]){if(Math.random()<.015){const g=(100+Math.random()*200)*1000*S.bm;S.cash+=g;toast('Бизнес принёс '+fmt(g))}if(Math.random()<.015)maint()}
if(S.sec%75==0)banner()}
function renderX(){const c=1000*Math.pow(3,S.lv-1);$('#lv').innerHTML=`<div class="it"><span>Уровень <b>${S.lv}</b> · клики и автокликер ×${mul()}<br><small style="color:var(--mut)">Bobka — ур. 2, Durex — ур. 4, Ahmedik — ур. 8</small></span><button onclick="lvUp()">${fmt(c)}</button></div>`;
$('#dr').innerHTML=DR.map((d,i)=>'<div class="it"><span>'+d[0]+' <b>'+d[1]+'</b><br><small style="color:var(--mut)">'+d[3]+(i==3&&S.own[3]?' · обслуживание '+Math.round(S.bm*100)+'%':'')+'</small></span>'+(S.own[i]?'<b class="up">Куплено</b>':'<button onclick="dream('+i+')">'+(d[2]>=1e6?d[2]/1e6+' млн':d[2]/1e3+' тыс.')+' ₸</button>')+'</div>').join('');
const gl=$('#gl');if(gl)gl.textContent='обновление через '+G.l+' с'}
const _r=render;render=function(){_r();renderX()};
const KEY='tl-save',S0=JSON.stringify(S),ST0=JSON.stringify(ST);let paused=true;
function save(q){try{localStorage.setItem(KEY,JSON.stringify({S,ST:Object.fromEntries(Object.keys(ST).map(k=>[k,{p:ST[k].p,tr:ST[k].tr,h:ST[k].h}])),G,B:{sp:B.sp,p:B.p}}));if(!q)toast('Прогресс сохранён')}catch(e){if(!q)toast('Не удалось сохранить')}}
function has(){try{return !!localStorage.getItem(KEY)}catch(e){return false}}
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(!d)return;Object.assign(S,d.S);for(const k in d.ST)Object.assign(ST[k],d.ST[k]);Object.assign(G,d.G);Object.assign(B,d.B);B.run=null}catch(e){}}
function clearUi(){$('#nt').innerHTML='';const b=$('#bn');if(b)b.remove();document.querySelectorAll('.ad,.q').forEach(e=>e.remove());closeM()}
function resetGame(){try{localStorage.removeItem(KEY)}catch(e){}Object.assign(S,JSON.parse(S0));const t=JSON.parse(ST0);for(const k in t)Object.assign(ST[k],t[k]);G.l=120;G.c=Array(16).fill(null);B.run=null;clearUi();renderBets();render()}
function menu(first){paused=true;clearUi();if(!first)save(1);const hs=has(),mk=(t,f)=>'<button class="b" onclick="'+f+'">'+t+'</button>';$('#mn').style.display='flex';$('#mn').innerHTML='<div class="box"><h3>Truelance</h3><p style="color:var(--mut)">'+(first?'Добро пожаловать! Накопите на мечту.':'Игра на паузе')+'</p>'+(first?(hs?mk('▶ Продолжить','resume(1)')+mk('🆕 Новая игра','startNew()'):mk('▶ Начать игру','startNew()')):mk('▶ Продолжить','resume()')+mk('💾 Сохранить прогресс','save()')+'<button class="b" style="background:var(--dn)" onclick="rs(this)">🗑 Сбросить прогресс</button>')+'</div>'}
function resume(f){if(f)load();$('#mn').style.display='none';paused=false;renderBets();render();if(!S.goal)pickGoal()}
function startNew(){resetGame();$('#mn').style.display='none';paused=false;pickGoal()}
function rs(b){if(!b.dataset.c){b.dataset.c=1;b.textContent='Точно сбросить? Нажмите ещё раз';return}startNew()}
$('#mb').onclick=()=>menu(false);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&!paused)save(1)});
renderBets();render();setInterval(tick,1000);menu(true);
</script></body></html>
